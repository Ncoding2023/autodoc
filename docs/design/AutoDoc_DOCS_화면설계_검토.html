</style><header><h1>AutoDoc · DOCS 화면설계 개정안</h1><p>2026-10-23 검토 초안 · 상단에서 화면 선택 · 화면 속 버튼은 설계 표시이며 실제 기능은 동작하지 않습니다.</p></header><nav aria-label="설계 화면"><button type="button" data-page="0" aria-pressed="true">09 DOCS 사용자 흐름</button><button type="button" data-page="1" aria-pressed="false">10 양식 업로드</button><button type="button" data-page="2" aria-pressed="false">11 입력 항목 설정</button><button type="button" data-page="3" aria-pressed="false">12 DOCS 템플릿 선택</button><button type="button" data-page="4" aria-pressed="false">13 DOCS 항목별 작성</button><button type="button" data-page="5" aria-pressed="false">14 생성 결과·다운로드</button></nav><main><section id="page-0" ><svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DOCS 사용자 흐름"><rect width="1600" height="1000" fill="#fff"/><rect x="35" y="22" width="1530" height="42" fill="none" stroke="none"/><text x="49" y="49.5" fill="#172B4D" font-size="26" font-weight="700" text-anchor="start">AutoDoc · DOCS 개정안 09 | DOCS 사용자 흐름</text><rect x="35" y="70" width="1530" height="32" fill="none" stroke="none"/><text x="49" y="90.0" fill="#64748B" font-size="16" font-weight="400" text-anchor="start">설계 초안 · 2026-10-23 · 양식 등록은 한 번, 문서 작성은 반복 사용</text><rect x="35" y="118" width="1530" height="54" fill="#172B4D" stroke="#172B4D"/><text x="49" y="149.25" fill="white" font-size="17" font-weight="700" text-anchor="start">AutoDoc    /    대시보드    /    문서 관리    /    템플릿 관리                                             내 계정    로그아웃</text><rect x="35" y="842" width="1530" height="130" fill="#EFF6FF" stroke="#BFDBFE"/><text x="49" y="887.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">범위: DOCX 양식 기반 작성과 다운로드, 작성 중 항목명 변경. 기존 02·03·05·08의 DOCS 흐름은 개정안으로 대체한다.</text><text x="49" y="911.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">후속: AI 항목 자동 인식, 원본 위치 강조, 실시간 미리보기, 반복 표·이미지 입력. SHEETS는 현 상태 보류.</text><text x="49" y="935.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">업로드한 원본을 참고 화면으로 표시하는 것과 원본을 웹 편집기로 재구현하는 것은 구분한다.</text><rect x="60" y="194" width="1460" height="38" fill="none" stroke="none"/><text x="74" y="218.75" fill="#172B4D" font-size="23" font-weight="700" text-anchor="start">사용자 흐름과 첫 구현 범위</text><rect x="60" y="236" width="1460" height="30" fill="none" stroke="none"/><text x="74" y="254.75" fill="#64748B" font-size="15" font-weight="400" text-anchor="start">초기 구현 가정: 입력 위치가 {{담당자}} 형태로 표시된 DOCX를 사용한다. 일반 파일의 빈칸 자동 인식은 포함하지 않는다.</text><rect x="60" y="300" width="1480" height="200" fill="#F1F5F9" stroke="#CBD5E1"/><text x="74" y="404.25" fill="#172B4D" font-size="17" font-weight="400" text-anchor="start"></text><rect x="80" y="316" width="240" height="36" fill="none" stroke="none"/><text x="94" y="338.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="start">양식 등록 · 처음 한 번</text><rect x="90" y="380" width="310" height="82" fill="white" stroke="#CBD5E1"/><text x="245.0" y="412.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">10 양식 업로드</text><text x="245.0" y="438.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">준비 방법 안내</text><rect x="450" y="380" width="310" height="82" fill="white" stroke="#CBD5E1"/><text x="605.0" y="412.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">11 입력 항목 설정</text><text x="605.0" y="438.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">표시 이름·형식</text><rect x="810" y="380" width="310" height="82" fill="white" stroke="#CBD5E1"/><text x="965.0" y="412.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">템플릿 저장</text><text x="965.0" y="438.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">기본 / 내 템플릿 재사용</text><rect x="405" y="392" width="40" height="50" fill="none" stroke="none"/><text x="425.0" y="423.5" fill="#172B4D" font-size="26" font-weight="400" text-anchor="middle">→</text><rect x="765" y="392" width="40" height="50" fill="none" stroke="none"/><text x="785.0" y="423.5" fill="#172B4D" font-size="26" font-weight="400" text-anchor="middle">→</text><rect x="60" y="530" width="1480" height="245" fill="#F1F5F9" stroke="#CBD5E1"/><text x="74" y="656.75" fill="#172B4D" font-size="17" font-weight="400" text-anchor="start"></text><rect x="80" y="546" width="320" height="36" fill="none" stroke="none"/><text x="94" y="568.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="start">문서 작성 · 필요할 때마다</text><rect x="90" y="610" width="310" height="92" fill="white" stroke="#CBD5E1"/><text x="245.0" y="647.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">12 템플릿 선택</text><text x="245.0" y="673.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">양식 확인</text><rect x="450" y="610" width="310" height="92" fill="white" stroke="#CBD5E1"/><text x="605.0" y="647.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">13 항목별 내용 작성</text><text x="605.0" y="673.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">임시저장·미리보기 갱신</text><rect x="810" y="610" width="310" height="92" fill="white" stroke="#CBD5E1"/><text x="965.0" y="647.5" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">14 문서 생성 결과</text><text x="965.0" y="673.0" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">DOCX 다운로드·이어서 수정</text><rect x="405" y="630" width="40" height="50" fill="none" stroke="none"/><text x="425.0" y="661.5" fill="#172B4D" font-size="26" font-weight="400" text-anchor="middle">→</text><rect x="765" y="630" width="40" height="50" fill="none" stroke="none"/><text x="785.0" y="661.5" fill="#172B4D" font-size="26" font-weight="400" text-anchor="middle">→</text><rect x="1180" y="375" width="330" height="340" fill="#EFF6FF" stroke="#BFDBFE"/><text x="1194" y="428.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">자동화할 작업</text><text x="1194" y="455.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start"></text><text x="1194" y="482.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">양식 재사용</text><text x="1194" y="509.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">문서마다 다른 입력창 구성</text><text x="1194" y="536.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">입력값을 양식 위치에 반영</text><text x="1194" y="563.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">완성 파일 생성</text><text x="1194" y="590.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start"></text><text x="1194" y="617.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">작성자가 하는 작업</text><text x="1194" y="644.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start"></text><text x="1194" y="671.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">업무 내용 작성·검토</text></svg></section><section id="page-1" hidden><svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="양식 업로드"><rect width="1600" height="1000" fill="#fff"/><rect x="35" y="22" width="1530" height="42" fill="none" stroke="none"/><text x="49" y="49.5" fill="#172B4D" font-size="26" font-weight="700" text-anchor="start">AutoDoc · DOCS 개정안 10 | 양식 업로드</text><rect x="35" y="70" width="1530" height="32" fill="none" stroke="none"/><text x="49" y="90.0" fill="#64748B" font-size="16" font-weight="400" text-anchor="start">진입: 템플릿 관리 → DOCS 양식 등록 → 파일 업로드</text><rect x="35" y="118" width="1530" height="54" fill="#172B4D" stroke="#172B4D"/><text x="49" y="149.25" fill="white" font-size="17" font-weight="700" text-anchor="start">AutoDoc    /    대시보드    /    문서 관리    /    템플릿 관리                                             내 계정    로그아웃</text><rect x="35" y="842" width="1530" height="130" fill="#EFF6FF" stroke="#BFDBFE"/><text x="49" y="887.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">계속: 파일 유효성 확인 및 입력 표시 탐색 후 11로 이동. 실제 업로드 상태는 대기 / 처리 중 / 완료 / 실패로 구분한다.</text><text x="49" y="911.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">실패: DOCX 아님·파일 손상·읽을 수 없는 문서·지원하지 않는 구성은 사유와 재시도를 제공한다.</text><text x="49" y="935.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">입력 표시가 없으면 다음 단계로 진행하지 않고 샘플 다운로드와 준비 방법을 안내한다. 취소하면 저장하지 않는다.</text><rect x="60" y="194" width="1460" height="38" fill="none" stroke="none"/><text x="74" y="218.75" fill="#172B4D" font-size="23" font-weight="700" text-anchor="start">회사에서 사용하는 DOCX 양식을 등록하세요</text><rect x="60" y="236" width="1460" height="30" fill="none" stroke="none"/><text x="74" y="254.75" fill="#64748B" font-size="15" font-weight="400" text-anchor="start">처음 한 번 양식을 준비하면, 작성자는 해당 양식을 선택해 내용만 입력합니다.</text><rect x="60" y="290" width="880" height="300" fill="#F1F5F9" stroke="#CBD5E1"/><text x="500.0" y="382.25" fill="#172B4D" font-size="21" font-weight="400" text-anchor="middle">DOCX 파일을 여기에 끌어다 놓으세요</text><text x="500.0" y="413.75" fill="#172B4D" font-size="21" font-weight="400" text-anchor="middle"></text><text x="500.0" y="445.25" fill="#172B4D" font-size="21" font-weight="400" text-anchor="middle">또는 아래 버튼으로 선택하세요</text><text x="500.0" y="476.75" fill="#172B4D" font-size="21" font-weight="400" text-anchor="middle"></text><text x="500.0" y="508.25" fill="#172B4D" font-size="21" font-weight="400" text-anchor="middle">지원 형식: .docx</text><rect x="360" y="515" width="270" height="42" fill="white" stroke="#CBD5E1"/><text x="495.0" y="540.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">파일 선택</text><rect x="970" y="290" width="550" height="300" fill="white" stroke="#CBD5E1"/><text x="984" y="350.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">양식 준비 방법</text><text x="984" y="377.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start"></text><text x="984" y="404.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">1. 변경할 이름 자리 {{담당자.label}}과</text><text x="984" y="431.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">   내용 자리 {{담당자}}를 표시합니다.</text><text x="984" y="458.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">2. DOCX로 저장하고 업로드합니다.</text><text x="984" y="485.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">3. 추출된 항목의 이름과 형식을 확인합니다.</text><text x="984" y="512.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start"></text><text x="984" y="539.0" fill="#172B4D" font-size="18" font-weight="400" text-anchor="start">표시 없는 문서의 입력 위치를 자동 판단하지 않습니다.</text><rect x="995" y="610" width="240" height="42" fill="white" stroke="#CBD5E1"/><text x="1115.0" y="635.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">샘플 양식 다운로드</text><rect x="60" y="615" width="880" height="95" fill="#F0FDF4" stroke="#BBF7D0"/><text x="74" y="654.0" fill="#166534" font-size="17" font-weight="400" text-anchor="start">선택한 파일: 인수인계서.docx</text><text x="74" y="679.5" fill="#166534" font-size="17" font-weight="400" text-anchor="start">파일 확인 완료 · 입력 항목 4개 발견</text><rect x="1180" y="748" width="140" height="42" fill="white" stroke="#CBD5E1"/><text x="1250.0" y="773.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="middle">취소</text><rect x="1340" y="748" width="180" height="42" fill="#2563EB" stroke="#2563EB"/><text x="1430.0" y="773.25" fill="white" font-size="17" font-weight="700" text-anchor="middle">항목 설정으로</text></svg></section><section id="page-2" hidden><svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="입력 항목 설정"><rect width="1600" height="1000" fill="#fff"/><rect x="35" y="22" width="1530" height="42" fill="none" stroke="none"/><text x="49" y="49.5" fill="#172B4D" font-size="26" font-weight="700" text-anchor="start">AutoDoc · DOCS 개정안 11 | 입력 항목 설정</text><rect x="35" y="70" width="1530" height="32" fill="none" stroke="none"/><text x="49" y="90.0" fill="#64748B" font-size="16" font-weight="400" text-anchor="start">진입: 양식 업로드 완료 → 원본 확인 → 항목 설정 → 템플릿 저장</text><rect x="35" y="118" width="1530" height="54" fill="#172B4D" stroke="#172B4D"/><text x="49" y="149.25" fill="white" font-size="17" font-weight="700" text-anchor="start">AutoDoc    /    대시보드    /    문서 관리    /    템플릿 관리                                             내 계정    로그아웃</text><rect x="35" y="842" width="1530" height="130" fill="#EFF6FF" stroke="#BFDBFE"/><text x="49" y="887.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">항목은 DOCX의 입력 표시에서 추출한다. 이름·형식만 설정하며 필수 여부 체크는 제공하지 않는다. 원본에 없는 위치를 만들지 않는다.</text><text x="49" y="911.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">같은 표시가 여러 곳에 있으면 입력창은 하나이며 모든 위치에 같은 값을 반영한다. 연결 안 된 표시가 있으면 저장을 차단한다.</text><text x="49" y="935.0" fill="#172B4D" font-size="16" font-weight="400" text-anchor="start">미리보기 변환 실패 시 다시 시도·원본 다운로드를 제공한다. 확인 체크 없이 항목 검증을 통과하면 저장할 수 있다.</text><rect x="60" y="194" width="1460" height="38" fill="none" stroke="none"/><text x="74" y="218.75" fill="#172B4D" font-size="23" font-weight="700" text-anchor="start">입력 항목을 확인해 주세요</text><rect x="60" y="236" width="1460" height="30" fill="none" stroke="none"/><text x="74" y="254.75" fill="#64748B" font-size="15" font-weight="400" text-anchor="start">원본 양식은 그대로 두고, 항목명을 입력칸에서 바로 수정합니다. 예: 담당자 → 업무자. 별도 수정 창은 없습니다.</text><rect x="60" y="285" width="760" height="520" fill="#F1F5F9" stroke="#CBD5E1"/><text x="74" y="549.25" fill="#172B4D" font-size="17" font-weight="400" text-anchor="start"></text><rect x="80" y="302" width="720" height="36" fill="none" stroke="none"/><text x="94" y="324.25" fill="#172B4D" font-size="17" font-weight="700" text-anchor="start">원본 양식 미리보기                         1 / 2 페이지</text><rect x="150" y="356" width="580" height="425" fill="white" stroke="#CBD5E1"/><text x="164" y="425.5" fill="#172B4D" font-size="22" font-weight="400" text-anchor="start">인수인계서</text><text x="164" y="458.5" fill="#172B4D" font-size="22" font-weight="400" text-anchor="start"></text><text x="
